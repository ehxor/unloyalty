# Unloyalty behind an existing Traefik (HTTPS via its certificate resolver).
#   UNLOYALTY_HOST=wallet.example.com docker compose up -d --build
# Assumes Traefik watches Docker, shares the external network "proxy", and has a resolver named "letsencrypt".
# Using Tailscale instead? See docker-compose.tailscale.yml, or README "Quick start".

services:
  unloyalty:
    build: .
    image: unloyalty:latest
    restart: unless-stopped
    environment:
      ALLOW_REGISTRATION: "false" # the first account can always register; add more with `create-user`
      SESSION_TTL: 90d
      TRUST_PROXY_HEADERS: "true" # only Traefik can reach the container (no published ports)
    volumes:
      - unloyalty-data:/data
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.unloyalty.rule: Host(`${UNLOYALTY_HOST:?set UNLOYALTY_HOST}`)
      traefik.http.routers.unloyalty.entrypoints: websecure
      traefik.http.routers.unloyalty.tls.certresolver: letsencrypt
      traefik.http.services.unloyalty.loadbalancer.server.port: "8080"

volumes:
  unloyalty-data:

networks:
  proxy:
    external: true
